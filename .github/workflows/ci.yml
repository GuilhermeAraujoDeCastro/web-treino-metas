# Build de produção a cada push, pra pegar erro de empacotamento antes da Vercel.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: for f in dist/js/*.js dist/sw.js api/*.js; do node --check "$f"; done
