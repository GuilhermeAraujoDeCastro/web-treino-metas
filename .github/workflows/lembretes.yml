# Chama /api/send-reminders de hora em hora (o cron gratuito da Vercel so roda 1x por dia).
# Precisa de dois segredos no repositorio: SITE_URL (ex.: https://corpo-bem.vercel.app) e CRON_SECRET.
name: Lembretes

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar a function de lembretes
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Configure os segredos SITE_URL e CRON_SECRET no GitHub."; exit 0
          fi
          curl --fail --silent --show-error -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/send-reminders"
